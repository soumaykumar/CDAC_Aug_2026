<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing Example</title>
    <style>
        .box {
            width: 400px;
            height: 200px;
            padding: 30px;
            border: 5px solid #2563eb;
            margin: 30px;
            box-sizing: border-box;
            background-color:aliceblue;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Box Model</h2>
        <p>
            This div has a fixed width and height.
            Padding and border are included within
            the specified dimensions.
        </p>
    </div>
</body>
</html>
