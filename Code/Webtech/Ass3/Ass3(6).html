<!DOCTYPE html>
<html>
<head>
    <title>CDAC Courses</title>
    <style>
        .container{
            width:80%;
            margin:auto;
        }
        .course{
            padding:20px;
            margin:20px;
            border:1px solid black;
        }
        h2{
            text-align:center;
        }
        .module{
            padding:15px;
            margin:10px;
            background-color:#eee;
        }
        .highlight{
            box-shadow: 4px 10px gray;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="course">
        <h2>PGDAC</h2>
        <div class="module highlight">C++ Programming</div>
        <div class="module">Java Programming</div>
        <div class="module highlight">Web Programming</div>
    </div>

    <div class="course">
        <h2>PGDAI</h2>
        <div class="module highlight">Python Programming</div>
        <div class="module">Machine Learning</div>
        <div class="module highlight">Deep Learning</div>
    </div>

    <div class="course">
        <h2>PGDBDA</h2>
        <div class="module highlight">Big Data</div>
        <div class="module">Data Analytics</div>
        <div class="module highlight">Hadoop & Spark</div>
    </div>
</div>
</body>
</html>
