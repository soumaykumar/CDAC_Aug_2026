<!DOCTYPE html>
<html>
<head>
    <title>Colored Table</title>
    <style>
        h2{
            font-family:'Times New Roman';
            font-weight:bold;
        }
        table{
            width:100%;
            border-collapse:collapse;
        }
        th{
            background-color:yellow;
            padding:14px 5px;
            text-align:left;
            font-family:'Times New Roman';
            font-weight:bold;
        }
        td{
            padding:12px 5px;
            font-family:'Times New Roman';
        }
        tr:nth-child(even){
            background-color:grey;
        }
    </style>
</head>
<body>
    <h2>Colored Table Header</h2>
    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Salary</th>
        </tr>
        <tr>
            <td>Mohit</td>
            <td>Sharma</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Raj</td>
            <td>Gupta</td>
            <td>150</td>
        </tr>
        <tr>
            <td>Joe</td>
            <td>Singh</td>
            <td>300</td>
        </tr>
        <tr>
            <td>Chintu</td>
            <td>Sharma</td>
            <td>250</td>
        </tr>
    </table>
</body>
</html>
