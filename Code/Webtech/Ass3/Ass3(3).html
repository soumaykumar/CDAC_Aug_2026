<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        #a{
            font-weight: bold;
            color: blue;
            text-decoration-line: underline;
        }
        #b{
            font-style: italic;
            color: blue;
        }
        #x{
            background-color: lightblue;
        }
        #y{
            background-color: lightskyblue;
        }
    </style>
</head>
<body>
    <div>
    <h2>CSS(Cascading Stylesheet)</h2>
    <p id="x"><span id="a">CSS (Cascading Style Sheets) </span>is a language used to style and design web pages.
    It controls the appearance of HTML elements,such as<span id="b"> colors, fonts, sizes, spacing, and layouts.</span></p>
    <p id="y">CSS helps make websites attractive, organized, and responsive on different devices.</p>
    </div>
</body>
</html>
