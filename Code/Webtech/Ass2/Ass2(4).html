<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaOrder</title>
</head>
<body bgcolor="00ff00">
<main>
<form action ="bold text.htm" autocomplete="on">
    <h2>Pizza Order Form</h2>
    <label for="name">Name</label>
    <input type="text" id="name" name="name"><br><br>
    <label for="name">Address</label>
    <input type="text" id="address" name="address">
    <h2>Size</h2>
    <input type="radio" name="Size" id="Small" name="Small">Small<br>
    <input type="radio" name="Size" id="Medium" name="Medium">Medium<br>
    <input type="radio" name="Size" id="Large" name="Large">Large<br>
    <h2>Toppings</h2>
    <input type="checkbox" name="Toppings" id="p" name="p">Pepperoni<br>
    <input type="checkbox" name="Toppings" id="s" name="s">Sausage<br>
    <input type="checkbox" name="Toppings" id="o" name="o">Olives<br>
    <input type="checkbox" name="Toppings" id="m" name="m">Mushrooms<br>
    <input type="checkbox" name="Toppings" id="ec" name="ec">Extra Cheese<br>
    <input type="submit" value="Deliver Order">
    <input type="reset" value="Clear"><br>
    <textarea id="output" rows="10" cols="40" readonly></textarea>

</form>
</main>
</body>
</html>
